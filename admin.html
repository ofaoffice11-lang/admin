<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-VISA Admin Panel</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; padding: 20px; margin: 0; }
        .admin-card { max-width: 650px; margin: 20px auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #8b0000; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #27ae60; color: white; border: none; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #219150; }
        .success-msg { color: green; text-align: center; font-weight: bold; margin-top: 15px; display: none; }
    </style>
</head>
<body>

    <div class="admin-card">
        <h2>e-VISA Data Entry Panel</h2>
        <form id="visaForm">
            <div class="form-group">
                <label>Visa Number</label>
                <input type="text" id="visaNo" placeholder="e.g. 689362484" required>
            </div>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullName" placeholder="e.g. MD ASRAFUL SARDAR" required>
            </div>
            <div class="form-group">
                <label>Passport Number</label>
                <input type="text" id="passportNo" placeholder="e.g. A16767727" required>
            </div>
            <div class="form-group">
                <label>Birth Date (DD/MM/YYYY)</label>
                <input type="text" id="birthDate" placeholder="01/01/1997" required>
            </div>
            <div class="form-group">
                <label>Date of Issue</label>
                <input type="text" id="issueDate" placeholder="20/10/2026" required>
            </div>
            <div class="form-group">
                <label>Valid Until</label>
                <input type="text" id="validUntil" placeholder="20/10/2027" required>
            </div>
            <div class="form-group">
                <label>E-Payment No.</label>
                <input type="text" id="paymentNo" placeholder="68164223981099" required>
            </div>
            <button type="submit">Save & Generate Visa</button>
        </form>
        <div id="msg" class="success-msg">Visa Saved Successfully! You can search it now.</div>
    </div>

    <script>
        document.getElementById("visaForm").addEventListener("submit", function(e) {
            e.preventDefault();
            
            var visaData = {
                visaNo: document.getElementById("visaNo").value.trim(),
                fullName: document.getElementById("fullName").value.trim().toUpperCase(),
                passportNo: document.getElementById("passportNo").value.trim().toUpperCase(),
                birthDate: document.getElementById("birthDate").value.trim(),
                issueDate: document.getElementById("issueDate").value.trim(),
                validUntil: document.getElementById("validUntil").value.trim(),
                paymentNo: document.getElementById("paymentNo").value.trim()
            };

            // Save to LocalStorage Database
            var currentVisas = JSON.parse(localStorage.getItem("visaDatabase") || "{}");
            currentVisas[visaData.passportNo] = visaData;
            currentVisas[visaData.visaNo] = visaData;
            localStorage.setItem("visaDatabase", JSON.stringify(currentVisas));

            document.getElementById("msg").style.display = "block";
            document.getElementById("visaForm").reset();
            setTimeout(() => { document.getElementById("msg").style.display = "none"; }, 3000);
        });
    </script>
</body>
</html>
